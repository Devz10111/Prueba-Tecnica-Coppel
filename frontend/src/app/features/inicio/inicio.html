<section class="py-3 py-md-4">
  <!-- Encabezado de la pantalla principal. -->
  <header class="text-center mb-4 mb-md-5">
    <span class="badge text-bg-primary mb-3">Grupo Coppel</span>
    <h1 class="display-5 fw-bold text-uppercase">Reserva de Espacios</h1>
    <p class="lead text-secondary mx-auto mb-0" style="max-width: 680px;">
      Selecciona una opción para comenzar. Puedes reservar un espacio,
      consultar una reserva existente o revisar la disponibilidad del día.
    </p>
  </header>

  <!-- Tarjetas de acceso rápido.
       row + col de Bootstrap: 1 columna en teléfono, 2 en tableta y 3 en escritorio. -->
  <div class="row g-4 justify-content-center">
    @for (acceso of accesos; track acceso.ruta) {
      <div class="col-12 col-sm-6 col-lg-4">
        <a
          [routerLink]="acceso.ruta"
          class="card tarjeta-acceso h-100 border-0 shadow-sm text-decoration-none text-reset"
        >
          <div class="card-body d-flex flex-column align-items-center text-center p-4 p-lg-5">
            <!-- Icono de Bootstrap Icons. -->
            <div
              class="icono-acceso rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3"
            >
              <i class="bi {{ acceso.icono }}"></i>
            </div>

            <h2 class="h4 fw-bold mb-2">{{ acceso.titulo }}</h2>
            <p class="text-secondary mb-4">{{ acceso.descripcion }}</p>

            <!-- mt-auto empuja el botón al fondo para que las tarjetas queden parejas. -->
            <span class="btn btn-primary mt-auto w-100">
              Entrar <i class="bi bi-arrow-right ms-1"></i>
            </span>
          </div>
        </a>
      </div>
    }
  </div>
</section>
