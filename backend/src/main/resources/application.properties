# ─── Identidad de la aplicación ───
# Nombre lógico de la app. Aparece en los logs y sirve para identificarla
# si algún día forma parte de una arquitectura de microservicios.
spring.application.name=reservas


# ─── Conexión a la base de datos (PostgreSQL) ───
# URL JDBC: protocolo (jdbc:postgresql) + servidor (localhost)
# + puerto (5432, el de PostgreSQL por defecto) + nombre de la base (reservas_db).
spring.datasource.url=jdbc:postgresql://localhost:5432/reservas_db

# Usuario y contraseña con los que la aplicación entra a PostgreSQL.
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:123456}

# ─── Configuración de JPA / Hibernate (el ORM) ───
# Qué hace Hibernate con las tablas al arrancar:
#   update   → crea las tablas si no existen y agrega columnas nuevas, sin borrar datos.
#   (otras opciones: create, create-drop, validate, none)
# Práctico en desarrollo porque las tablas se generan solas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update

# Imprime en consola cada sentencia SQL que Hibernate ejecuta.
# Útil para ver qué consulta se lanza realmente y para depurar.
spring.jpa.show-sql=true

# Da formato legible (con saltos de línea) al SQL que se imprime.
spring.jpa.properties.hibernate.format_sql=true

# Cierra la sesión de base de datos al terminar la capa de servicio,
# no al terminar de renderizar la respuesta HTTP. Evita consultas "ocultas"
# fuera de los servicios y es la buena práctica en APIs REST.
spring.jpa.open-in-view=false

# JWT: clave de firma (mínimo 32 caracteres) y duración del token
app.jwt.secret=${JWT_SECRET:clave-secreta-solo-para-desarrollo-cambiar-en-produccion}
app.jwt.expiracion-minutos=120